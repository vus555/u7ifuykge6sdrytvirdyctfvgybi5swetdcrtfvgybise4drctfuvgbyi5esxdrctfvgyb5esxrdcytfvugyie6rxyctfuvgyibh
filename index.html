<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скріншот</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* Контейнер, який входить у fullscreen */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    cursor: zoom-in;
    overflow: hidden;
  }

  .stage:fullscreen {
    cursor: zoom-out;
  }

  /* Основне фото — завжди на весь екран */
  .photo {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
  }

  /* Друге фото — у звичайному режимі стоїть у своєму місці */
  .overlay-photo {
    position: absolute;
    left: 1.72%;
    top: 44.74%;
    width: 29.80%;
    height: 33.33%;
    display: block;
    object-fit: contain;
    cursor: zoom-in;
  }

  /* У FULLSCREEN — друге фото теж розтягується на весь екран, як перше */
  .stage:fullscreen .overlay-photo {
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
  }
</style>
</head>
<body>

  <div class="stage" onclick="toggleFullscreen(this)">
    <img
      src="https://i.postimg.cc/0y2djZ8d/file-00000000beb882439e314b43f17d013b.png"
      alt="Скріншот"
      class="photo"
    >
    <img
      src="https://i.postimg.cc/FK9Kf2vN/file-00000000df8081f4a6bfb0b9c582112a.png"
      alt="Поверх"
      class="overlay-photo"
    >
  </div>

  <script>
    function toggleFullscreen(el) {
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>

</body>
</html>
