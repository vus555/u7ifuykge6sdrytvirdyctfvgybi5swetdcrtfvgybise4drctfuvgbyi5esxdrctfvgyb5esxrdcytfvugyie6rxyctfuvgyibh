<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Небо, фото и вода</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Небо на весь экран */
        body {
            background: linear-gradient(
                to bottom,
                #1e3c72 0%,
                #2a5298 25%,
                #4a90c2 50%,
                #87ceeb 75%,
                #c9e8f5 100%
            );
        }

        /* Фото — опущено пониже */
        .photo {
            position: absolute;
            top: 20%;
            left: 0;
            width: 100%;
            height: 80%;
            object-fit: contain;
        }

        /* Кнопка полноэкранного режима — слева сверху */
        .fullscreen-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }
        .fullscreen-btn:active {
            transform: scale(0.95);
        }
        .fullscreen-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Вода — светлое сверху, тёмное снизу */
        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(18% - 2px);
            background: linear-gradient(
                to top,
                rgba(2, 25, 60, 0.85) 0%,      /* тёмное снизу */
                rgba(5, 55, 105, 0.70) 20%,
                rgba(10, 95, 150, 0.55) 45%,
                rgba(30, 150, 190, 0.38) 70%,
                rgba(120, 210, 230, 0.20) 90%,
                rgba(220, 245, 255, 0.12) 100% /* светлое сверху */
            );
            pointer-events: none;
        }

        /* Блики на поверхности воды */
        .water::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse 40% 30% at 25% 8%, rgba(255, 255, 255, 0.22), transparent 70%),
                radial-gradient(ellipse 30% 20% at 72% 12%, rgba(255, 255, 255, 0.15), transparent 70%),
                radial-gradient(ellipse 50% 15% at 50% 4%, rgba(255, 255, 255, 0.10), transparent 70%);
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>
    <!-- Кнопка полного экрана -->
    <button class="fullscreen-btn" id="fsBtn" title="Полноэкранный режим">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>

    <!-- Фото -->
    <img class="photo" src="https://i.postimg.cc/XJPmBD2T/file-000000005ff882108b3db3ff21659a57.png" alt="Фото">

    <!-- Вода -->
    <div class="water"></div>

    <script>
        const fsBtn = document.getElementById('fsBtn');

        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                    </svg>`;
                fsBtn.title = 'Выйти из полноэкранного режима';
            } else {
                fsBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>`;
                fsBtn.title = 'Полноэкранный режим';
            }
        });
    </script>
</body>
</html>
