<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скріншот</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Размытый фон (заполняет рамки на ноутбуке) */
  .blur-bg {
    position: absolute;
    top: -5%; left: -5%;
    width: 110%; height: 110%;
    background-image: url('https://i.postimg.cc/0y2djZ8d/file-00000000beb882439e314b43f17d013b.png');
    background-size: cover;
    background-position: center;
    filter: blur(20px) brightness(0.4);
    z-index: 1;
  }

  .photo {
    width: 100vw;
    max-height: 100vh; 
    object-fit: contain; /* Сохраняет пропорции, касса не сплющивается */
    display: block;
    cursor: zoom-in;
    z-index: 2; /* Картинка поверх размытого фона */
    position: relative;
  }
</style>
</head>
<body>

  <div class="blur-bg"></div>

  <img
    src="https://i.postimg.cc/0y2djZ8d/file-00000000beb882439e314b43f17d013b.png"
    alt="Скріншот"
    class="photo"
    onclick="toggleFullscreen(this)"
  >

  <script>
    function toggleFullscreen(el) {
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>

</body>
</html>
