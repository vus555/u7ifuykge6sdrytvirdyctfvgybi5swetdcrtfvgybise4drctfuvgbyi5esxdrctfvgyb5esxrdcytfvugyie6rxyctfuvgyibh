<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Гра - Магазин (Тільки зверху/знизу рамки)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000; /* Чорний фон для смуг зверху і знизу */
    
    /* Центруємо гру по вертикалі та горизонталі */
    display: flex;
    align-items: center;
    justify-content: center;
    
    -webkit-tap-highlight-color: transparent;
  }

  /* Ігрова сцена */
  #game-container {
    position: relative;
    
    /* МАГІЯ: Завжди 100% ширини екрана! */
    width: 100vw; 
    
    /* Висота підлаштовується під пропорції картинки (1185 / 835) */
    aspect-ratio: 1185 / 835; 
    
    flex-shrink: 0;
  }

  /* Фон */
  .bg-image {
    width: 100%;
    height: 100%;
    /* fill безпечний, бо контейнер вже має правильні пропорції */
    object-fit: fill; 
    display: block;
    pointer-events: none; 
  }

  /* Каса (стоїть на своєму місці) */
  .overlay-photo {
    position: absolute;
    left: 1.18%;
    top: 49.87%;
    width: 36.52%;
    height: auto;
    pointer-events: none;
    display: block;
  }
</style>
</head>
<body>

  <div id="game-container">
    <img src="https://i.postimg.cc/0y2djZ8d/file-00000000beb882439e314b43f17d013b.png" class="bg-image" alt="Магазин">
    <img src="https://i.postimg.cc/FK9Kf2vN/file-00000000df8081f4a6bfb0b9c582112a.png" class="overlay-photo" alt="Каса">
  </div>

</body>
</html>
