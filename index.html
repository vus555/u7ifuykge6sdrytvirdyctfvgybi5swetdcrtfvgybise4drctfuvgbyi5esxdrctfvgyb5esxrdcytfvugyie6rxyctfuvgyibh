<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Гра - Магазин</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh; 
    overflow: hidden;
    background: #000; /* Черный фон для рамок */
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    cursor: pointer; /* Показываем, что можно кликнуть */
  }

  #game-container {
    position: relative;
    width: 1185px; 
    height: 835px;
    flex-shrink: 0;
    transform-origin: center center;
  }

  .bg-image {
    width: 100%;
    height: 100%;
    object-fit: fill; 
    display: block;
    pointer-events: none; 
  }

  /* --- КАССА --- */
  .cashier-wrapper {
    position: absolute;
    left: 1.18%;
    top: 49.87%;
    width: 36.52%;
    height: auto;
    pointer-events: none; /* Чтобы клик проходил сквозь кассу на фон */
  }

  .overlay-photo {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>

  <div id="game-container">
    <!-- Фон -->
    <img src="https://i.postimg.cc/0y2djZ8d/file-00000000beb882439e314b43f17d013b.png" class="bg-image" alt="Магазин">
    
    <!-- Касса -->
    <div class="cashier-wrapper">
      <img src="https://i.postimg.cc/FK9Kf2vN/file-00000000df8081f4a6bfb0b9c582112a.png" class="overlay-photo" alt="Каса">
    </div>
  </div>

<script>
  const container = document.getElementById('game-container');

  // Масштабирование (заполняет ширину, оставляя рамки сверху и снизу)
  function resizeGame() {
    const windowWidth = window.innerWidth;
    const gameWidth = 1185;
    const scale = windowWidth / gameWidth;
    container.style.transform = `scale(${scale})`;
  }

  window.addEventListener('load', resizeGame);
  window.addEventListener('resize', resizeGame);
  window.addEventListener('orientationchange', resizeGame);

  // --- ПОЛНОЭКРАННЫЙ РЕЖИМ ПО КЛИКУ ---
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) {
        el.requestFullscreen().catch(err => console.log(err));
      } else if (el.webkitRequestFullscreen) { /* Safari */
        el.webkitRequestFullscreen();
      } else if (el.msRequestFullscreen) { /* IE11 */
        el.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }
  }

  // Вешаем клик на весь документ
  document.addEventListener('click', toggleFullscreen);
  
  // Для телефонов
  document.addEventListener('touchstart', (e) => {
    if(e.cancelable) e.preventDefault(); 
    toggleFullscreen();
  }, { passive: false });
</script>

</body>
</html>
