<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Остров 3D — Онлайн</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;overflow:hidden;font-family:'Nunito',sans-serif;background:#0a1929;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

#lobby{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(160deg,#1a4a6a 0%,#0d2a45 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;gap:14px;text-align:center;color:#fff;
}
#lobby h1{font-size:32px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.5);margin-bottom:8px}
#lobby h1 span{color:#ffb300}
#lobby p{font-size:14px;opacity:.7;max-width:300px;line-height:1.5;margin-bottom:12px}
#lobby button{width:100%;max-width:300px;padding:16px;border:0;border-radius:16px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;transition:transform .15s}
#lobby button:active{transform:scale(.96)}
.btn-solo{background:linear-gradient(160deg,#4a9fd8,#2a6fa8);color:#fff;box-shadow:0 8px 20px rgba(74,159,216,.4)}
.btn-create{background:#ffb300;color:#0d2a45;box-shadow:0 8px 20px rgba(255,179,0,.4)}
.btn-join{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)!important}
#roomCode{display:none;font-size:22px;font-weight:900;color:#ffb300;background:rgba(0,0,0,.3);padding:14px 24px;border-radius:14px;letter-spacing:3px;border:2px dashed rgba(255,179,0,.5)}
#joinInput{width:100%;max-width:300px;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:16px;font-weight:700;text-align:center;letter-spacing:2px;outline:none;display:none}
#lobbyStatus{font-size:14px;color:#ffb300;font-weight:700;min-height:20px}
.divider{width:100%;max-width:300px;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.4);font-size:12px;font-weight:700;margin:4px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.15)}

#game{position:fixed;inset:0;display:none;touch-action:none}
#game.active{display:block}
#three-cv{display:block;width:100%;height:100%;touch-action:none}

.hud{position:absolute;top:0;left:0;right:0;z-index:10;padding:14px 16px;display:flex;justify-content:space-between;gap:8px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);pointer-events:none}
.hud-stat{background:rgba(0,0,0,.6);padding:8px 14px;border-radius:14px;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hud-stat b{color:#ffb300;font-size:14px}

.mode-badge{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:rgba(74,159,216,.9);color:#fff;padding:5px 14px;border-radius:999px;font-size:11px;font-weight:800;z-index:10;letter-spacing:.5px;text-transform:uppercase;box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* Джойстик — фиксированный, не двигается */
.joystick-fixed{
  position:absolute;
  bottom:30px;left:30px;
  width:150px;height:150px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.25);
  z-index:15;
  touch-action:none;
  box-shadow:0 4px 20px rgba(0,0,0,.4), inset 0 0 30px rgba(255,255,255,.05);
}
.joystick-fixed::before{
  content:'';
  position:absolute;
  inset:15px;
  border-radius:50%;
  border:2px dashed rgba(255,255,255,.15);
}
.joystick-knob{
  position:absolute;
  width:65px;height:65px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #ffd670, #ffb300);
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 4px 12px rgba(255,179,0,.7);
  pointer-events:none;
  transition:transform .05s;
}

/* Зона камеры — правая половина */
.camera-zone{
  position:absolute;
  top:0;right:0;
  width:50%;height:100%;
  z-index:14;
  touch-action:none;
}

/* Зона джойстика — левая нижняя четверть */
.joystick-zone{
  position:absolute;
  bottom:0;left:0;
  width:50%;height:50%;
  z-index:14;
  touch-action:none;
}

/* Кнопка прыжка — побольше, справа снизу */
.jump-btn{
  position:absolute;
  bottom:40px;right:40px;
  width:80px;height:80px;
  border-radius:50%;
  border:0;
  background:radial-gradient(circle at 35% 35%, #6fc5ff, #2a6fa8);
  color:#fff;
  font-size:34px;
  cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(74,159,216,.6);
  transition:transform .1s;
  -webkit-tap-highlight-color:transparent;
  z-index:15;
  touch-action:none;
}
.jump-btn:active{transform:scale(.88)}

.hint{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:12px;font-weight:700;background:rgba(0,0,0,.5);padding:8px 16px;border-radius:12px;z-index:9;pointer-events:none;transition:opacity .5s;text-align:center;white-space:nowrap}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,.9);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:700;z-index:90;opacity:0;transition:all .3s;pointer-events:none;border:1px solid rgba(255,179,0,.3);max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="lobby">
  <h1>🏝 <span>ОСТРОВ 3D</span></h1>
  <p>Огромный остров. Ходи, бегай, прыгай. Позови друга!</p>

  <button class="btn-solo" id="soloBtn">🎮 Одиночная игра</button>

  <div class="divider">или с другом</div>

  <button class="btn-create" id="createBtn">🏝 Создать остров</button>
  <div id="roomCode"></div>
  <p id="lobbyStatus"></p>

  <button class="btn-join" id="showJoinBtn">🔗 Присоединиться</button>
  <input type="text" id="joinInput" placeholder="ВВЕДИ КОД" maxlength="6">
  <button class="btn-join" id="joinBtn" style="display:none">✅ Войти на остров</button>
</div>

<div id="game">
  <canvas id="three-cv"></canvas>

  <div class="hud">
    <div class="hud-stat">👤 <b id="hudName">Ты</b></div>
    <div class="hud-stat">🎮 <b id="hudStatus">Онлайн</b></div>
  </div>

  <div class="mode-badge" id="modeBadge" style="display:none">🎮 Одиночная игра</div>

  <!-- Фиксированный джойстик -->
  <div class="joystick-fixed" id="joyFixed">
    <div class="joystick-knob" id="joyKnob"></div>
  </div>
  <div class="joystick-zone" id="joystickZone"></div>

  <!-- Зона камеры -->
  <div class="camera-zone" id="cameraZone"></div>

  <!-- Прыжок -->
  <button class="jump-btn" id="jumpBtn">⬆</button>

  <div class="hint" id="hint">Слева — джойстик · Справа — камера</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══ КОНФИГ ═══ */
const WORLD_RADIUS = 300;
const WATER_SIZE = 3000;
const GRAVITY = 1.6;
const JUMP_FORCE = 12;
const MOVE_SPEED = 0.35;
const PLAYER_RADIUS = 1.2;
const COLLISION_OBJECTS = [];

/* ═══ СОСТОЯНИЕ ═══ */
let state = {
  me: { x: 0, y: 7, z: 0, vx: 0, vz: 0, vy: 0, angle: 0, isMoving: false, onGround: true },
  friend: null
};

let cameraAngle = 0;
let cameraPitch = 0.5;
let cameraDist = 12;

let isSolo = false;
let isHost = false;
let peer = null, conn = null, roomId = null;

/* ═══ СЕТЬ ═══ */
const lobby = document.getElementById('lobby');
const lobbyStatus = document.getElementById('lobbyStatus');
function genCode(){ return Math.random().toString(36).substring(2,8).toUpperCase(); }

document.getElementById('soloBtn').addEventListener('click',()=>{ isSolo = true; startGame(); });

document.getElementById('createBtn').addEventListener('click',()=>{
  isHost = true;
  roomId = genCode();
  lobbyStatus.textContent = 'Создаём остров...';
  peer = new Peer('island3d-'+roomId);
  peer.on('open',()=>{
    document.getElementById('soloBtn').style.display='none';
    document.getElementById('createBtn').style.display='none';
    document.getElementById('showJoinBtn').style.display='none';
    document.querySelector('.divider').style.display='none';
    document.getElementById('roomCode').style.display='block';
    document.getElementById('roomCode').textContent = roomId;
    lobbyStatus.textContent = 'Ждём друга... Отправь ему код ↑';
  });
  peer.on('connection',(c)=>{ conn = c; setupConn(); });
  peer.on('error',(e)=>{ lobbyStatus.textContent = 'Ошибка: '+e.message; });
});

document.getElementById('showJoinBtn').addEventListener('click',()=>{
  document.getElementById('soloBtn').style.display='none';
  document.getElementById('createBtn').style.display='none';
  document.getElementById('showJoinBtn').style.display='none';
  document.querySelector('.divider').style.display='none';
  document.getElementById('joinInput').style.display='block';
  document.getElementById('joinBtn').style.display='block';
});

document.getElementById('joinBtn').addEventListener('click',()=>{
  const code = document.getElementById('joinInput').value.toUpperCase().trim();
  if(!code){ lobbyStatus.textContent='Введи код'; return; }
  lobbyStatus.textContent = 'Подключаемся...';
  peer = new Peer();
  peer.on('open',()=>{ conn = peer.connect('island3d-'+code); setupConn(); });
  peer.on('error',(e)=>{ lobbyStatus.textContent = 'Ошибка: '+e.message; });
});

function setupConn(){
  conn.on('open',()=>{ startGame(); startNetwork(); });
  conn.on('data',(data)=>{ handleNet(data); });
  conn.on('close',()=>{ showToast('Соединение потеряно'); });
}

let lastSent = 0;
function startNetwork(){
  setInterval(()=>{
    if(!conn || !conn.open) return;
    const now = Date.now();
    if(now - lastSent > 50){
      conn.send({ type: 'pos', x: state.me.x, y: state.me.y, z: state.me.z, angle: state.me.angle });
      lastSent = now;
    }
  }, 50);
}

function handleNet(data){
  if(data.type === 'pos'){
    state.friend = { x: data.x, y: data.y, z: data.z || 0, angle: data.angle || 0 };
  }
}

/* ═══ THREE.JS ═══ */
let renderer, scene, camera;
let water, waterGeo, sunLight, sunMesh;
let myChar, friendChar;
let palmTrees = [];

function startGame(){
  lobby.style.display='none';
  document.getElementById('game').classList.add('active');
  if(isSolo) document.getElementById('modeBadge').style.display='block';

  initThree();
  createWorld();
  createMyCharacter();
  createFriendCharacter();

  state.me.y = islandHeight(0, 0) + 1.3;

  window.addEventListener('resize', resize);
  resize();

  initControls();
  gameLoop();

  setTimeout(()=>{
    const h = document.getElementById('hint');
    if(h) h.style.opacity = '0';
  }, 4000);
}

/* ── Текстуры ── */
function createSandTexture(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#e8d0a0';
  ctx.fillRect(0,0,512,512);
  for(let i = 0; i < 40000; i++){
    const x = Math.random()*512;
    const y = Math.random()*512;
    if(Math.random() > 0.5){
      ctx.fillStyle = 'rgba(200,170,120,' + (Math.random()*0.35) + ')';
    } else {
      ctx.fillStyle = 'rgba(255,245,210,' + (Math.random()*0.3) + ')';
    }
    ctx.fillRect(x, y, 1, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(20, 20);
  return tex;
}

function createGrassTexture(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#6ab04c';
  ctx.fillRect(0,0,512,512);
  for(let i = 0; i < 30000; i++){
    const x = Math.random()*512;
    const y = Math.random()*512;
    const r = Math.random();
    if(r > 0.66){
      ctx.fillStyle = 'rgba(50,120,30,' + (Math.random()*0.5) + ')';
    } else if(r > 0.33){
      ctx.fillStyle = 'rgba(120,200,90,' + (Math.random()*0.4) + ')';
    } else {
      ctx.fillStyle = 'rgba(80,150,50,' + (Math.random()*0.5) + ')';
    }
    ctx.fillRect(x, y, 1, 2);
  }
  for(let i = 0; i < 40; i++){
    const x = Math.random()*512;
    const y = Math.random()*512;
    const r = 15 + Math.random()*40;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(40,100,30,0.25)');
    g.addColorStop(1, 'rgba(40,100,30,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(30, 30);
  return tex;
}

function createWaterTexture(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4fa8d8';
  ctx.fillRect(0,0,512,512);
  for(let i = 0; i < 200; i++){
    const x = Math.random()*512;
    const y = Math.random()*512;
    const r = 10 + Math.random()*50;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(150,220,255,0.25)');
    g.addColorStop(1, 'rgba(150,220,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(15, 15);
  return tex;
}

function initThree(){
  const cv = document.getElementById('three-cv');
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x9fd4f0);
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xb8e0f0, 400, 1400);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  scene.add(new THREE.HemisphereLight(0xb8e0f0, 0x5a7a3a, 0.6));

  sunLight = new THREE.DirectionalLight(0xfff4d6, 1.15);
  sunLight.position.set(200, 400, 150);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.left = -350;
  sunLight.shadow.camera.right = 350;
  sunLight.shadow.camera.top = 350;
  sunLight.shadow.camera.bottom = -350;
  sunLight.shadow.camera.near = 1;
  sunLight.shadow.camera.far = 1200;
  sunLight.shadow.bias = -0.001;
  scene.add(sunLight);

  const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff4d6 });
  sunMesh = new THREE.Mesh(new THREE.SphereGeometry(20, 24, 24), sunMat);
  sunMesh.position.set(500, 700, 350);
  scene.add(sunMesh);

  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffeebb, transparent: true, opacity: 0.25 });
  const glow = new THREE.Mesh(new THREE.SphereGeometry(50, 24, 24), glowMat);
  glow.position.copy(sunMesh.position);
  scene.add(glow);

  createSunRays();
}

function createSunRays(){
  const raysGroup = new THREE.Group();
  raysGroup.position.set(200, 400, 150);
  for(let i = 0; i < 10; i++){
    const angle = (Math.PI * 2 / 10) * i + Math.random() * 0.3;
    const rayGeo = new THREE.ConeGeometry(15 + Math.random()*10, 200 + Math.random()*150, 8, 1, true);
    const rayMat = new THREE.MeshBasicMaterial({
      color: 0xfff4d6, transparent: true, opacity: 0.07 + Math.random()*0.05,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
    });
    const ray = new THREE.Mesh(rayGeo, rayMat);
    ray.rotation.z = Math.cos(angle) * 0.6;
    ray.rotation.x = Math.sin(angle) * 0.6;
    ray.position.set(Math.cos(angle) * 15, -60, Math.sin(angle) * 15);
    raysGroup.add(ray);
  }
  scene.add(raysGroup);
  scene.userData.rays = raysGroup;
}

function resize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}

function islandHeight(x, z){
  const dist = Math.hypot(x, z);
  if(dist > WORLD_RADIUS) return -3;
  const t = dist / WORLD_RADIUS;
  const height = (1 - t*t) * 6;
  const h1 = Math.sin(x * 0.015) * Math.cos(z * 0.015) * 2;
  const h2 = Math.sin(x * 0.04 + 1.5) * Math.cos(z * 0.035 + 0.5) * 1;
  return height + h1 + h2;
}

function createWorld(){
  waterGeo = new THREE.PlaneGeometry(WATER_SIZE, WATER_SIZE, 80, 80);
  const waterMat = new THREE.MeshPhongMaterial({
    map: createWaterTexture(), color: 0x3a96d1, transparent: true, opacity: 0.88,
    shininess: 120, specular: 0x88ddff
  });
  water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.y = -1.5;
  water.receiveShadow = true;
  scene.add(water);
  water.userData.baseY = waterGeo.attributes.position.array.slice();

  const sandSegs = 96;
  const sandGeo = new THREE.PlaneGeometry(WORLD_RADIUS * 2.2, WORLD_RADIUS * 2.2, sandSegs, sandSegs);
  const sandPos = sandGeo.attributes.position;
  for(let i = 0; i < sandPos.count; i++){
    const x = sandPos.getX(i);
    const z = -sandPos.getY(i);
    const dist = Math.hypot(x, z);
    if(dist > WORLD_RADIUS){
      sandPos.setZ(i, -5);
    } else {
      const h = islandHeight(x, z);
      const t = dist / WORLD_RADIUS;
      const edgeFade = t > 0.85 ? (1 - t) / 0.15 : 1;
      sandPos.setZ(i, h * edgeFade);
    }
  }
  sandGeo.computeVertexNormals();
  const sand = new THREE.Mesh(sandGeo, new THREE.MeshLambertMaterial({ map: createSandTexture() }));
  sand.rotation.x = -Math.PI / 2;
  sand.position.y = 1;
  sand.receiveShadow = true;
  scene.add(sand);

  const grassRadius = WORLD_RADIUS * 0.78;
  const grassGeo = new THREE.PlaneGeometry(grassRadius * 2.2, grassRadius * 2.2, sandSegs, sandSegs);
  const grassPos = grassGeo.attributes.position;
  for(let i = 0; i < grassPos.count; i++){
    const x = grassPos.getX(i);
    const z = -grassPos.getY(i);
    const dist = Math.hypot(x, z);
    if(dist > grassRadius){
      grassPos.setZ(i, -5);
    } else {
      const h = islandHeight(x, z) + 0.15;
      const t = dist / grassRadius;
      const edgeFade = t > 0.85 ? (1 - t) / 0.15 : 1;
      grassPos.setZ(i, h * edgeFade);
    }
  }
  grassGeo.computeVertexNormals();
  const grass = new THREE.Mesh(grassGeo, new THREE.MeshLambertMaterial({ map: createGrassTexture() }));
  grass.rotation.x = -Math.PI / 2;
  grass.position.y = 1.15;
  grass.receiveShadow = true;
  scene.add(grass);

  for(let i = 0; i < 40; i++){
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * (WORLD_RADIUS * 0.75 - 40);
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    const palm = createPalm();
    palm.position.set(x, islandHeight(x, z) + 1, z);
    palm.userData.swayOffset = Math.random() * Math.PI * 2;
    scene.add(palm);
    palmTrees.push(palm);
    COLLISION_OBJECTS.push({ x, z, r: 1.2 });
  }

  const stoneMat = new THREE.MeshLambertMaterial({ color: 0x9a9088 });
  for(let i = 0; i < 60; i++){
    const size = 1.5 + Math.random() * 3;
    const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 0), stoneMat);
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * (WORLD_RADIUS * 0.7 - 20);
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    stone.position.set(x, islandHeight(x, z) + 1, z);
    stone.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    stone.castShadow = true;
    stone.receiveShadow = true;
    scene.add(stone);
    COLLISION_OBJECTS.push({ x, z, r: size * 0.8 });
  }

  const bushMat = new THREE.MeshLambertMaterial({ color: 0x4a9a3a });
  for(let i = 0; i < 80; i++){
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * (WORLD_RADIUS * 0.7 - 30);
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    const bush = new THREE.Mesh(new THREE.SphereGeometry(1 + Math.random()*0.6, 8, 6), bushMat);
    bush.position.set(x, islandHeight(x, z) + 1.5, z);
    bush.scale.set(1, 0.7, 1);
    bush.castShadow = true;
    scene.add(bush);
  }
}

function createPalm(){
  const palm = new THREE.Group();
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x9b6a3b });
  for(let i = 0; i < 7; i++){
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.5 - i*0.03, 0.6 - i*0.03, 2.4, 10), trunkMat);
    seg.position.y = i * 2.2;
    seg.position.x = i * 0.2;
    seg.castShadow = true;
    palm.add(seg);
  }
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x2d8a3a });
  const leafMatDark = new THREE.MeshLambertMaterial({ color: 0x1e6b2a });
  for(let i = 0; i < 8; i++){
    const angle = (Math.PI * 2 / 8) * i;
    const leafGeo = new THREE.SphereGeometry(1, 8, 4);
    leafGeo.scale(5, 0.4, 1.6);
    const leaf = new THREE.Mesh(leafGeo, i % 2 ? leafMat : leafMatDark);
    leaf.position.set(Math.cos(angle) * 3.5 + 1.2, 14.5, Math.sin(angle) * 3.5);
    leaf.rotation.z = -0.3;
    leaf.rotation.y = angle;
    leaf.castShadow = true;
    palm.add(leaf);
  }
  const cocoMat = new THREE.MeshLambertMaterial({ color: 0x3d2510 });
  for(let i = 0; i < 3; i++){
    const coco = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), cocoMat);
    coco.position.set((Math.random() - 0.5) * 2 + 1.2, 13.3, (Math.random() - 0.5) * 2);
    coco.castShadow = true;
    palm.add(coco);
  }
  return palm;
}

function createHumanoid(color){
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color });
  const darkMat = new THREE.MeshLambertMaterial({ color: darkenColor(color, 0.7) });

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.75, 20, 20), mat);
  head.position.y = 4.4; head.castShadow = true; group.add(head);

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.4, 10), mat);
  neck.position.y = 3.65; neck.castShadow = true; group.add(neck);

  const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.7, 1.5, 14), mat);
  chest.position.y = 2.85; chest.castShadow = true; group.add(chest);

  const waist = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.75, 0.7, 14), mat);
  waist.position.y = 1.75; waist.castShadow = true; group.add(waist);

  function createArm(side){
    const g = new THREE.Group();
    const u = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1.3, 10), mat);
    u.position.y = -0.65; u.castShadow = true; g.add(u);
    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.18, 1.2, 10), darkMat);
    l.position.y = -1.9; l.castShadow = true; g.add(l);
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), darkMat);
    h.position.y = -2.6; h.castShadow = true; g.add(h);
    g.position.set(side * 0.9, 3.5, 0);
    return g;
  }
  const armL = createArm(-1), armR = createArm(1);
  group.add(armL); group.add(armR);

  function createLeg(side){
    const g = new THREE.Group();
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.26, 1.4, 10), mat);
    t.position.y = -0.7; t.castShadow = true; g.add(t);
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.22, 1.3, 10), darkMat);
    s.position.y = -2.05; s.castShadow = true; g.add(s);
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.8), darkMat);
    f.position.set(0, -2.85, 0.15); f.castShadow = true; g.add(f);
    g.position.set(side * 0.35, 1.4, 0);
    return g;
  }
  const legL = createLeg(-1), legR = createLeg(1);
  group.add(legL); group.add(legR);

  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const eyeGeo = new THREE.SphereGeometry(0.11, 10, 10);
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.25, 4.5, 0.65); group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.25, 4.5, 0.65); group.add(eyeR);

  group.userData = { arms: { L: armL, R: armR }, legs: { L: legL, R: legR }, head, walkTime: 0 };
  return group;
}

function darkenColor(hex, factor){
  const r = ((hex >> 16) & 255) * factor;
  const g = ((hex >> 8) & 255) * factor;
  const b = (hex & 255) * factor;
  return (Math.floor(r) << 16) | (Math.floor(g) << 8) | Math.floor(b);
}

function createMyCharacter(){
  myChar = createHumanoid(0x999999);
  scene.add(myChar);
}

function createFriendCharacter(){
  friendChar = createHumanoid(0xb0b0b0);
  friendChar.visible = false;
  scene.add(friendChar);
}

function checkCollision(newX, newZ){
  for(const obj of COLLISION_OBJECTS){
    const dx = newX - obj.x;
    const dz = newZ - obj.z;
    const dist = Math.hypot(dx, dz);
    const minDist = obj.r + PLAYER_RADIUS;
    if(dist < minDist){
      if(dist < 0.001) return { x: obj.x, z: obj.z + minDist };
      const angle = Math.atan2(dz, dx);
      return { x: obj.x + Math.cos(angle) * minDist, z: obj.z + Math.sin(angle) * minDist };
    }
  }
  return null;
}

/* ═══ УПРАВЛЕНИЕ ═══ */
let keys = {};
let joyActive = false;
let joyTouchId = null;
let joyCenterX = 0, joyCenterY = 0;
let joyCurX = 0, joyCurY = 0;
let joyMaxDist = 50;

let camActive = false;
let camTouchId = null;
let camLastX = 0, camLastY = 0;

function initControls(){
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if(e.code === 'Space'){ e.preventDefault(); doJump(); }
  });
  document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  /* Мышь ПК */
  let mouseRight = false;
  const cv = document.getElementById('three-cv');
  cv.addEventListener('mousedown', (e) => {
    if(e.button === 2){ mouseRight = true; camLastX = e.clientX; camLastY = e.clientY; }
  });
  cv.addEventListener('mousemove', (e) => {
    if(mouseRight){
      const dx = e.clientX - camLastX;
      const dy = e.clientY - camLastY;
      cameraAngle -= dx * 0.01;
      cameraPitch = Math.max(0.15, Math.min(1.3, cameraPitch + dy * 0.005));
      camLastX = e.clientX; camLastY = e.clientY;
    }
  });
  cv.addEventListener('mouseup', () => { mouseRight = false; });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('wheel', (e) => {
    cameraDist = Math.max(6, Math.min(35, cameraDist + e.deltaY * 0.01));
  });

  /* Кнопка прыжка */
  document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    doJump();
  }, { passive: false });
  document.getElementById('jumpBtn').addEventListener('click', (e) => {
    if(!('ontouchstart' in window)) doJump();
  });

  /* ДЖОЙСТИК — фиксированный */
  const joyZone = document.getElementById('joystickZone');
  const knob = document.getElementById('joyKnob');

  joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyActive = true;
    joyTouchId = t.identifier;
    /* Центр джойстика — всегда фиксирован */
    const joyEl = document.getElementById('joyFixed');
    const rect = joyEl.getBoundingClientRect();
    joyCenterX = rect.left + rect.width / 2;
    joyCenterY = rect.top + rect.height / 2;
    joyCurX = t.clientX;
    joyCurY = t.clientY;
  }, { passive: false });

  joyZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if(!joyActive) return;
    const t = Array.from(e.changedTouches).find(x => x.identifier === joyTouchId);
    if(!t) return;
    joyCurX = t.clientX;
    joyCurY = t.clientY;

    let dx = joyCurX - joyCenterX;
    let dy = joyCurY - joyCenterY;
    const dist = Math.hypot(dx, dy);
    if(dist > joyMaxDist){
      dx = dx / dist * joyMaxDist;
      dy = dy / dist * joyMaxDist;
    }
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }, { passive: false });

  const endJoy = (e) => {
    if(!joyActive) return;
    joyActive = false;
    joyTouchId = null;
    knob.style.transform = 'translate(-50%,-50%)';
  };
  joyZone.addEventListener('touchend', endJoy);
  joyZone.addEventListener('touchcancel', endJoy);

  /* КАМЕРА */
  const camZone = document.getElementById('cameraZone');
  camZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    camActive = true;
    camTouchId = t.identifier;
    camLastX = t.clientX;
    camLastY = t.clientY;
  }, { passive: false });

  camZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if(!camActive) return;
    const t = Array.from(e.changedTouches).find(x => x.identifier === camTouchId);
    if(!t) return;
    const dx = t.clientX - camLastX;
    const dy = t.clientY - camLastY;
    cameraAngle -= dx * 0.008;
    cameraPitch = Math.max(0.15, Math.min(1.3, cameraPitch + dy * 0.005));
    camLastX = t.clientX;
    camLastY = t.clientY;
  }, { passive: false });

  const endCam = () => { camActive = false; camTouchId = null; };
  camZone.addEventListener('touchend', endCam);
  camZone.addEventListener('touchcancel', endCam);
}

function doJump(){
  if(state.me.onGround){
    state.me.vy = JUMP_FORCE;
    state.me.onGround = false;
  }
}

/* ═══ ЦИКЛ ═══ */
let lastTime = performance.now();

function gameLoop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

function update(dt){
  let mx = 0, mz = 0;

  if(keys['w'] || keys['ц'] || keys['arrowup']) mz -= 1;
  if(keys['s'] || keys['ы'] || keys['arrowdown']) mz += 1;
  if(keys['a'] || keys['ф'] || keys['arrowleft']) mx -= 1;
  if(keys['d'] || keys['в'] || keys['arrowright']) mx += 1;

  if(joyActive){
    const jdx = joyCurX - joyCenterX;
    const jdy = joyCurY - joyCenterY;
    const dist = Math.hypot(jdx, jdy);
    if(dist > 8){
      const camDirX = Math.sin(cameraAngle);
      const camDirZ = Math.cos(cameraAngle);
      const forward = -jdy / joyMaxDist;
      const right = jdx / joyMaxDist;
      mx += camDirX * forward + camDirZ * right;
      mz += camDirZ * forward - camDirX * right;
    }
  } else if(mx !== 0 || mz !== 0){
    const camDirX = Math.sin(cameraAngle);
    const camDirZ = Math.cos(cameraAngle);
    const newMx = camDirX * (-mz) + camDirZ * mx;
    const newMz = camDirZ * (-mz) - camDirX * mx;
    mx = newMx; mz = newMz;
  }

  const len = Math.hypot(mx, mz);
  if(len > 1){ mx /= len; mz /= len; }

  state.me.vx = (state.me.vx || 0) * 0.82 + mx * MOVE_SPEED;
  state.me.vz = (state.me.vz || 0) * 0.82 + mz * MOVE_SPEED;

  let newX = state.me.x + state.me.vx;
  let newZ = state.me.z + state.me.vz;

  const distFromCenter = Math.hypot(newX, newZ);
  const maxDist = WORLD_RADIUS - 8;
  if(distFromCenter > maxDist){
    const angle = Math.atan2(newZ, newX);
    newX = Math.cos(angle) * maxDist;
    newZ = Math.sin(angle) * maxDist;
    state.me.vx *= 0.5;
    state.me.vz *= 0.5;
  }

  const collision = checkCollision(newX, newZ);
  if(collision){
    newX = collision.x;
    newZ = collision.z;
    state.me.vx *= 0.3;
    state.me.vz *= 0.3;
  }

  state.me.x = newX;
  state.me.z = newZ;

  state.me.y += state.me.vy;
  state.me.vy -= GRAVITY;

  const groundY = islandHeight(state.me.x, state.me.z) + 1.3;

  if(state.me.y <= groundY){
    state.me.y = groundY;
    state.me.vy = 0;
    state.me.onGround = true;
  } else {
    state.me.onGround = false;
  }

  const speed = Math.hypot(state.me.vx, state.me.vz);
  if(speed > 0.02){
    const targetAngle = Math.atan2(state.me.vx, state.me.vz);
    let diff = targetAngle - state.me.angle;
    while(diff > Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    state.me.angle += diff * 0.25;
    state.me.isMoving = true;
  } else {
    state.me.isMoving = false;
  }
}

function animateWater(time){
  if(!water) return;
  const positions = waterGeo.attributes.position;
  const base = water.userData.baseY;
  for(let i = 0; i < positions.count; i++){
    const x = base[i * 3];
    const y = base[i * 3 + 1];
    const wave1 = Math.sin(x * 0.02 + time * 1.2) * 0.6;
    const wave2 = Math.cos(y * 0.03 + time * 0.9) * 0.5;
    const wave3 = Math.sin((x + y) * 0.015 + time * 1.8) * 0.4;
    positions.array[i * 3 + 2] = wave1 + wave2 + wave3;
  }
  positions.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

function animateCharacter(char, isMoving, dt){
  if(!char) return;
  const ud = char.userData;
  ud.walkTime += dt * (isMoving ? 11 : 2);
  const t = ud.walkTime;
  const inAir = (char === myChar) && !state.me.onGround;

  if(inAir){
    ud.arms.L.rotation.x = -1.6; ud.arms.R.rotation.x = -1.6;
    ud.arms.L.rotation.z = -0.7; ud.arms.R.rotation.z = 0.7;
    ud.legs.L.rotation.x = -0.4; ud.legs.R.rotation.x = 0.4;
  } else if(isMoving){
    const swing = Math.sin(t) * 0.8;
    ud.arms.L.rotation.x = swing; ud.arms.R.rotation.x = -swing;
    ud.arms.L.rotation.z = -0.1; ud.arms.R.rotation.z = 0.1;
    ud.legs.L.rotation.x = -swing * 0.75;
    ud.legs.R.rotation.x = swing * 0.75;
  } else {
    const idle = Math.sin(t * 0.5) * 0.1;
    ud.arms.L.rotation.x = idle; ud.arms.R.rotation.x = -idle;
    ud.arms.L.rotation.z = -0.08; ud.arms.R.rotation.z = 0.08;
    ud.legs.L.rotation.x = 0; ud.legs.R.rotation.x = 0;
  }
  ud.head.rotation.z = Math.sin(t * 0.6) * 0.04;
}

function render(){
  const time = performance.now() / 1000;

  animateWater(time);

  if(scene.userData.rays){
    const rays = scene.userData.rays;
    rays.rotation.y = time * 0.05;
    rays.children.forEach((ray, i) => {
      ray.material.opacity = 0.05 + Math.sin(time * 1.5 + i) * 0.04;
    });
  }

  if(sunMesh){
    const s = 1 + Math.sin(time * 0.8) * 0.05;
    sunMesh.scale.set(s, s, s);
  }

  if(myChar){
    myChar.position.set(state.me.x, state.me.y, state.me.z);
    myChar.rotation.y = state.me.angle;
    animateCharacter(myChar, state.me.isMoving, 0.016);
  }

  if(friendChar){
    if(state.friend){
      friendChar.visible = true;
      friendChar.position.x += (state.friend.x - friendChar.position.x) * 0.3;
      friendChar.position.y += (state.friend.y - friendChar.position.y) * 0.3;
      friendChar.position.z += (state.friend.z - friendChar.position.z) * 0.3;
      let diff = state.friend.angle - friendChar.rotation.y;
      while(diff > Math.PI) diff -= Math.PI * 2;
      while(diff < -Math.PI) diff += Math.PI * 2;
      friendChar.rotation.y += diff * 0.2;
      animateCharacter(friendChar, true, 0.016);
    } else {
      friendChar.visible = false;
    }
  }

  palmTrees.forEach(palm => {
    const off = palm.userData.swayOffset || 0;
    palm.rotation.z = Math.sin(time * 0.7 + off) * 0.05;
    palm.rotation.x = Math.cos(time * 0.5 + off) * 0.03;
  });

  const camX = state.me.x - Math.sin(cameraAngle) * cameraDist * Math.cos(cameraPitch);
  const camZ = state.me.z - Math.cos(cameraAngle) * cameraDist * Math.cos(cameraPitch);
  const camY = state.me.y + 3 + cameraDist * Math.sin(cameraPitch);

  camera.position.x += (camX - camera.position.x) * 0.15;
  camera.position.y += (camY - camera.position.y) * 0.15;
  camera.position.z += (camZ - camera.position.z) * 0.15;

  camera.lookAt(state.me.x, state.me.y + 2.2, state.me.z);

  renderer.render(scene, camera);
}

let toastTimer = null;
function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
