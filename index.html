<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Гра - Магазин</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    /* Центруємо гру по центру екрану */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 
   * ІГРОВА СЦЕНА
   * Вона має фіксовані пропорції твого фону (1185 / 835).
   * Завдяки цьому вона ніколи не розтягнеться.
   */
  .game-scene {
    position: relative;
    aspect-ratio: 1185 / 835; 
    /* Робимо так, щоб сцена завжди вписувалась в екран (і на телефоні, і на ноуті) */
    width: 100%;
    max-width: 100vw;
    max-height: 100vh;
    /* Ця магія змушує її вписуватись без спотворень */
    max-width: calc(100vh * (1185 / 835));
    cursor: zoom-in;
  }

  .game-scene:fullscreen {
    cursor: zoom-out;
    /* У фулскріні сцена просто займає максимум місця, зберігаючи пропорції */
    max-width: 100vw;
    max-height: 100vh;
    width: 100%;
    height: 100%;
    aspect-ratio: 1185 / 835; 
  }

  /* Фонове зображення */
  .bg-image {
    width: 100%;
    height: 100%;
    object-fit: fill; /* fill безпечний, бо контейнер вже має правильні пропорції */
    display: block;
    pointer-events: none; /* Щоб клік йшов на сцену */
  }

  /* Каса (твої ідеальні координати) */
  .overlay-photo {
    position: absolute;
    left: 1.18%;
    top: 49.87%;
    width: 36.52%;
    height: auto;
    pointer-events: none; /* Щоб клік проходив крізь неї */
    display: block;
  }
</style>
</head>
<body>

  <!-- Ігрова сцена -->
  <div class="game-scene" onclick="toggleFullscreen(this)">
    <!-- Фон -->
    <img 
      src="https://i.postimg.cc/0y2djZ8d/file-00000000beb882439e314b43f17d013b.png" 
      class="bg-image" 
      alt="Магазин"
    >
    <!-- Каса поверх -->
    <img 
      src="https://i.postimg.cc/FK9Kf2vN/file-00000000df8081f4a6bfb0b9c582112a.png" 
      class="overlay-photo" 
      alt="Каса"
    >
  </div>

  <script>
    function toggleFullscreen(el) {
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }
  </script>

</body>
</html>
