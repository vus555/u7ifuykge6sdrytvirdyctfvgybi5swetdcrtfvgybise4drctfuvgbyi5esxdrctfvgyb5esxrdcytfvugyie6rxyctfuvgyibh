<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Гра - Магазин</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh; 
    overflow: hidden;
    background: #000; /* Черные рамки */
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    cursor: pointer;
  }

  #game-container {
    position: relative;
    width: 1185px; 
    height: 835px;
    flex-shrink: 0;
    transform-origin: center center;
  }

  .bg-image {
    width: 100%;
    height: 100%;
    object-fit: fill; 
    display: block;
    pointer-events: none; 
  }

  /* --- КАССА --- */
  .cashier-wrapper {
    position: absolute;
    left: 1.18%;
    top: 49.87%;
    width: 36.52%;
    height: auto;
    pointer-events: none; 
  }

  .overlay-photo {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>

  <div id="game-container">
    <img src="https://i.postimg.cc/0y2djZ8d/file-00000000beb882439e314b43f17d013b.png" class="bg-image" alt="Магазин">
    
    <div class="cashier-wrapper">
      <img src="https://i.postimg.cc/FK9Kf2vN/file-00000000df8081f4a6bfb0b9c582112a.png" class="overlay-photo" alt="Каса">
    </div>
  </div>

<script>
  const container = document.getElementById('game-container');

  // УМНОЕ МАСШТАБИРОВАНИЕ
  function resizeGame() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    // Оригинальные размеры игры
    const gameWidth = 1185;
    const gameHeight = 835;

    // Считаем масштаб для ширины и для высоты
    const scaleX = windowWidth / gameWidth;
    const scaleY = windowHeight / gameHeight;

    // МАГИЯ: Math.min выбирает НАИМЕНЬШИЙ масштаб.
    // Это значит, что игра ВСЕГДА будет вписываться целиком.
    // На широком ноутбуке она упрется в высоту (появятся рамки по бокам).
    // На узком телефоне она упрется в ширину (появятся рамки сверху и снизу).
    const scale = Math.min(scaleX, scaleY);
    
    container.style.transform = `scale(${scale})`;
  }

  window.addEventListener('load', resizeGame);
  window.addEventListener('resize', resizeGame);
  window.addEventListener('orientationchange', resizeGame);

  // --- ПОЛНОЭКРАННЫЙ РЕЖИМ ---
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(err => console.log(err));
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    }
  }

  document.addEventListener('click', toggleFullscreen);
  document.addEventListener('touchstart', (e) => {
    if(e.cancelable) e.preventDefault(); 
    toggleFullscreen();
  }, { passive: false });
</script>

</body>
</html>
