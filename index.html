<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>PhoneBuy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;overflow:hidden;font-family:'Nunito',sans-serif}
body{background:linear-gradient(160deg,#24395f 0%,#17294b 43%,#142541 100%);position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 15%,rgba(88,124,255,.35),transparent 40%),radial-gradient(circle at 85% 80%,rgba(225,104,181,.22),transparent 40%);pointer-events:none;z-index:0}
.phone-screen{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column}
.statusbar{height:50px;padding:16px 26px 0;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:17px;color:#fff;flex-shrink:0}
.status-right{display:flex;align-items:center;gap:7px}
.status-right svg{width:17px;height:17px}
.battery{position:relative;width:26px;height:13px;border:1.7px solid currentColor;border-radius:4px;padding:1.7px}
.battery::after{content:'';position:absolute;right:-4px;top:3.5px;width:2.5px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.battery i{display:block;width:80%;height:100%;background:currentColor;border-radius:1.7px}
.battery-text{font-size:15px;font-weight:800;margin-left:2px}
.desktop{flex:1;padding:30px 8px 24px;overflow-y:auto;scrollbar-width:none}
.desktop::-webkit-scrollbar{display:none}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;gap:20px 4px}
.app-item{display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:0;padding:0;cursor:pointer;font-family:inherit;width:100%;max-width:80px;-webkit-tap-highlight-color:transparent;transition:transform .15s ease}
.app-item:active{transform:scale(.88)}
.app-icon-wrap{position:relative;width:clamp(60px,17vw,72px);aspect-ratio:1}
.app-item.semi-big .app-icon-wrap{width:clamp(78px,21.5vw,90px)}
.app-item.slightly-smaller .app-icon-wrap{width:clamp(74px,20.4vw,85px)}
.app-icon{position:absolute;inset:0;border-radius:33%;background:var(--app-color);overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.12);display:grid;place-items:center}
.app-icon::before{content:'';position:absolute;inset:1px 1px 50% 1px;border-radius:33% 33% 45% 45%;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent);pointer-events:none;z-index:2}
.app-icon svg{position:relative;z-index:3;width:58%;height:58%;color:#fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.app-icon.has-image{background:transparent;box-shadow:none}
.app-icon.has-image::before{display:none}
.app-icon.has-image .icon-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:42%;display:block;z-index:1}
.app-label{font-weight:700;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-badge{position:absolute;top:-6px;right:-6px;z-index:10;min-width:23px;height:23px;padding:0 6px;display:grid;place-items:center;border-radius:999px;color:#fff;background:#ff3b30;border:2.5px solid #24395f;font-size:12px;font-weight:800}

.app-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:#0C0C0C;transform:translateY(100%);opacity:0;visibility:hidden;transition:transform .4s ease,opacity .3s ease,visibility .4s ease}
.app-screen.open{transform:translateY(0);opacity:1;visibility:visible}
.app-statusbar{flex-shrink:0;height:50px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:17px;color:#fff;background:#000}
.app-statusbar .status-right{display:flex;align-items:center;gap:7px}
.app-statusbar .status-right svg{width:17px;height:17px}
.app-statusbar .battery{position:relative;width:26px;height:13px;border:1.7px solid currentColor;border-radius:4px;padding:1.7px}
.app-statusbar .battery::after{content:'';position:absolute;right:-4px;top:3.5px;width:2.5px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.app-statusbar .battery i{display:block;width:80%;height:100%;background:currentColor;border-radius:1.7px}
.app-statusbar .battery-text{font-size:15px;font-weight:800;margin-left:2px}

.market-screen{ --yellow: #E6A000; --yellow-rgb: 230,160,0; }

.app-header{
  position:relative;
  flex-shrink:0;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--yellow);
  overflow:hidden;
  isolation:isolate;
}

.app-header .deco{
  position:absolute;
  border-radius:50%;
  z-index:0;
  pointer-events:none;
}
.app-header .d1{width:90px;height:90px;background:rgba(0,0,0,.14);top:-40px;right:10px;}
.app-header .d2{width:70px;height:70px;background:rgba(0,0,0,.13);bottom:-30px;right:120px;}
.app-header .d3{width:60px;height:60px;background:rgba(0,0,0,.12);top:-20px;left:-20px;}
.app-header .d4{width:55px;height:55px;background:rgba(0,0,0,.13);bottom:-20px;left:80px;}
.app-header .d5{width:36px;height:36px;background:rgba(0,0,0,.14);top:8px;left:45%;}

.app-back{
  position:relative;
  z-index:2;
  width:42px;height:42px;flex-shrink:0;border-radius:50%;border:0;
  background:#0C0C0C;color:#fff;display:grid;place-items:center;cursor:pointer;
}
.app-back svg{width:22px;height:22px}

.market-search-header{
  position:relative;
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
  z-index:2;
}
.market-search-input-wrap{
  position:relative;
  flex:1;
}
/* закруглил сильнее — border-radius 24px вместо 16 */
.market-search-input-wrap input{
  width:100%;height:48px;border-radius:24px;border:0;
  background:#0C0C0C;color:#fff;font-size:15px;font-weight:600;
  padding:0 18px 0 46px;outline:none;font-family:inherit;
}
.market-search-input-wrap input::placeholder{color:rgba(255,255,255,.45)}
.market-search-input-wrap svg.lupa{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--yellow);
}

/* кнопки-иконки справа — тоже круглее */
.icon-btn{
  width:48px;
  height:48px;
  flex-shrink:0;
  border-radius:24px;
  border:0;
  background:#0C0C0C;
  color:var(--yellow);
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:transform .15s ease, background .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.icon-btn:active{ transform:scale(.92); }
.icon-btn svg{ width:22px; height:22px; }

.dropdown{
  position:absolute;
  top:56px;
  background:#141414;
  border:1px solid rgba(var(--yellow-rgb),.2);
  border-radius:16px;
  padding:8px;
  min-width:200px;
  z-index:50;
  opacity:0;
  visibility:hidden;
  transform:translateY(-6px);
  transition:opacity .2s ease, visibility .2s ease, transform .2s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}
.dropdown.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.dropdown.filter-dd{ right:56px; }
.dropdown.sort-dd{ right:0; }

.dropdown-title{
  font-size:11px;
  font-weight:800;
  color:rgba(255,255,255,.45);
  text-transform:uppercase;
  letter-spacing:.5px;
  padding:6px 10px;
  margin-bottom:4px;
}
.dropdown-item{
  display:block;
  width:100%;
  text-align:left;
  padding:10px 12px;
  border:0;
  background:transparent;
  color:#fff;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  border-radius:10px;
  cursor:pointer;
  transition:background .15s ease;
}
.dropdown-item:hover,
.dropdown-item:active{ background:rgba(var(--yellow-rgb),.15); }
.dropdown-item.active{ background:var(--yellow); color:#0C0C0C; font-weight:800; }

.price-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px 10px;
}
.price-row input{
  width:70px;
  height:36px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.05);
  color:#fff;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  padding:0 10px;
  outline:none;
  text-align:center;
}
.price-row input::placeholder{ color:rgba(255,255,255,.35); }
.price-row span{ font-size:13px; color:rgba(255,255,255,.5); font-weight:700; }

.price-apply{
  width:calc(100% - 20px);
  margin:4px 10px 6px;
  height:38px;
  border-radius:10px;
  border:0;
  background:var(--yellow);
  color:#0C0C0C;
  font-family:inherit;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.app-content{flex:1;overflow-y:auto;padding:16px 16px 30px}
.market-list{display:flex;flex-direction:column;gap:20px;padding-top:4px}
.phone-card{position:relative;background:#141414;border:1px solid rgba(var(--yellow-rgb),.12);border-radius:26px;overflow:hidden}
.phone-photo{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#1a1a1a}
.phone-photo img{width:100%;height:100%;object-fit:cover;display:block}
.phone-badge{position:absolute;top:16px;left:16px;z-index:3;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;color:#0C0C0C;background:var(--yellow)}
.phone-info{padding:18px 20px 20px}
.phone-name{font-size:20px;font-weight:900;color:#fff;margin-bottom:6px}
.phone-spec{font-size:14px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:12px}
.phone-seller{font-size:13px;font-weight:600;color:rgba(var(--yellow-rgb),.8);margin-bottom:16px}
.phone-price-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;border-top:1px solid rgba(var(--yellow-rgb),.12)}
.phone-price{font-size:28px;font-weight:900;color:var(--yellow)}
.phone-buy{height:48px;padding:0 22px;border-radius:14px;border:0;background:var(--yellow);color:#0C0C0C;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="phone-screen">
  <div class="statusbar">
    <time>00:00</time>
    <div class="status-right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 19v-2M8 19v-5M12 19v-8M16 19v-11M20 19V4"/></svg>
      <span class="battery"><i></i></span>
      <b class="battery-text">84</b>
    </div>
  </div>

  <div class="desktop">
    <div class="app-grid">

      <div class="app-item semi-big" id="marketBtn">
        <span class="app-icon-wrap">
          <span class="app-icon has-image">
            <img class="icon-img" src="https://i.postimg.cc/hv1TbRVr/file-000000009b1081f4a034b2f2c711f242.png">
          </span>
        </span>
        <span class="app-label">Маркетплейс</span>
      </div>

      <div class="app-item semi-big">
        <span class="app-icon-wrap">
          <span class="app-icon has-image">
            <img class="icon-img" src="https://i.postimg.cc/59hwhpPW/file-00000000944082108b6468b994f0dc54.png">
          </span>
        </span>
        <span class="app-label">Склад</span>
      </div>

      <div class="app-item slightly-smaller">
        <span class="app-icon-wrap">
          <span class="app-icon has-image">
            <img class="icon-img" src="https://i.postimg.cc/SNKJt9hB/file-00000000be8482108e19f7f3de7012ea.png">
          </span>
        </span>
        <span class="app-label">Телефон</span>
      </div>

      <div class="app-item semi-big">
        <span class="app-icon-wrap">
          <span class="app-icon has-image">
            <img class="icon-img" src="https://i.postimg.cc/HWwxL2YH/file-000000006b388210b07fa7aac704ab53.png">
          </span>
        </span>
        <span class="app-label">Кошелёк</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#D9A207">
            <svg viewBox="0 0 48 48" fill="none"><path d="M12 8h18l6 6v26H12z" fill="#fff"/></svg>
          </span>
        </span>
        <span class="app-label">Заметки</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#2E75CC">
            <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="14" stroke="#fff" stroke-width="2.5" fill="none"/><ellipse cx="24" cy="24" rx="6" ry="14" stroke="#fff" stroke-width="2" fill="none"/><line x1="10" y1="24" x2="38" y2="24" stroke="#fff" stroke-width="2.5"/></svg>
          </span>
        </span>
        <span class="app-label">Интернет</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#199F7C">
            <svg viewBox="0 0 48 48" fill="none"><path d="M12 40V18l12-8 12 8v22" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" fill="none"/></svg>
          </span>
        </span>
        <span class="app-label">Недвижимость</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#D89A14">
            <svg viewBox="0 0 48 48" fill="none"><rect x="6" y="14" width="22" height="16" fill="#fff" rx="1.5"/></svg>
          </span>
        </span>
        <span class="app-label">Доставка</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#2B8EF0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.3 7.3 0 0 1-7.7 7.3 8.2 8.2 0 0 1-3.6-.8L4 19.5l1.4-4.1A7 7 0 0 1 4.7 12 7.3 7.3 0 0 1 12.3 4 7.3 7.3 0 0 1 20 11.5Z"/></svg>
            <span class="app-badge">1</span>
          </span>
        </span>
        <span class="app-label">Мессенджер</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#7A8794">
            <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="6" stroke="#fff" stroke-width="3" fill="none"/></svg>
          </span>
        </span>
        <span class="app-label">Настройки</span>
      </div>

    </div>
  </div>
</div>

<!-- МАРКЕТ -->
<div class="app-screen market-screen" id="marketScreen">
  <div class="app-statusbar">
    <time>00:00</time>
    <div class="status-right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 19v-2M8 19v-5M12 19v-8M16 19v-11M20 19V4"/></svg>
      <span class="battery"><i></i></span>
      <b class="battery-text">84</b>
    </div>
  </div>
  <div class="app-header">
    <span class="deco d1"></span>
    <span class="deco d2"></span>
    <span class="deco d3"></span>
    <span class="deco d4"></span>
    <span class="deco d5"></span>
    <button class="app-back" data-close="marketScreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

    <div class="market-search-header">
      <div class="market-search-input-wrap">
        <svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" placeholder="Поиск телефо..">
      </div>

      <button class="icon-btn" id="filterBtn" title="Фильтр по цене">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5h18M6 12h12M10 19h4"/>
        </svg>
      </button>

      <button class="icon-btn" id="sortBtn" title="Сортировка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/>
        </svg>
      </button>

      <div class="dropdown filter-dd" id="filterDd">
        <div class="dropdown-title">Цена</div>
        <div class="price-row">
          <input type="number" id="priceMin" placeholder="от" min="0">
          <span>—</span>
          <input type="number" id="priceMax" placeholder="до" min="0">
        </div>
        <button class="price-apply" id="priceApply">Применить</button>
      </div>

      <div class="dropdown sort-dd" id="sortDd">
        <div class="dropdown-title">Сортировка</div>
        <button class="dropdown-item active" data-sort="new">Сначала новые</button>
        <button class="dropdown-item" data-sort="old">Сначала старые</button>
        <button class="dropdown-item" data-sort="cheap">Дешёвые сначала</button>
        <button class="dropdown-item" data-sort="expensive">Дорогие сначала</button>
      </div>
    </div>
  </div>

  <div class="app-content">
    <div class="market-list">
      <div class="phone-card">
        <div class="phone-photo"><span class="phone-badge">Новый</span><img src="https://i.postimg.cc/SNQSVY9g/Screenshot-2026-09-19-16-52-40-790-ua-slando-edit.jpg"></div>
        <div class="phone-info">
          <div class="phone-name">iPhone 15 Pro</div>
          <div class="phone-spec">256 ГБ · Titanium</div>
          <div class="phone-seller">Продавец: Alex</div>
          <div class="phone-price-row">
            <div class="phone-price">$999</div>
            <button class="phone-buy">Купить</button>
          </div>
        </div>
      </div>
      <div class="phone-card">
        <div class="phone-photo"><span class="phone-badge">Б/У</span><img src="https://i.postimg.cc/HWzHJWNq/Screenshot-2026-09-19-16-53-05-828-ua-slando-edit.jpg"></div>
        <div class="phone-info">
          <div class="phone-name">Samsung S24 Ultra</div>
          <div class="phone-spec">512 ГБ · Black</div>
          <div class="phone-seller">Продавец: Marina</div>
          <div class="phone-price-row">
            <div class="phone-price">$849</div>
            <button class="phone-buy">Купить</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ЧАСЫ */
setInterval(()=>{
  const n=new Date();
  const t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  document.querySelector('.statusbar time').textContent=t;
  document.querySelectorAll('.app-statusbar time').forEach(el=>el.textContent=t);
},1000);

/* МАРКЕТ */
document.getElementById('marketBtn').addEventListener('click',()=>{
  document.getElementById('marketScreen').classList.add('open');
});

/* КНОПКИ НАЗАД */
document.querySelectorAll('.app-back').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.getElementById(btn.dataset.close).classList.remove('open');
  });
});

/* ФИЛЬТР И СОРТИРОВКА */
const filterBtn = document.getElementById('filterBtn');
const sortBtn = document.getElementById('sortBtn');
const filterDd = document.getElementById('filterDd');
const sortDd = document.getElementById('sortDd');

filterBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  sortDd.classList.remove('show');
  filterDd.classList.toggle('show');
});

sortBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  filterDd.classList.remove('show');
  sortDd.classList.toggle('show');
});

document.addEventListener('click',()=>{
  filterDd.classList.remove('show');
  sortDd.classList.remove('show');
});

filterDd.addEventListener('click',(e)=> e.stopPropagation());
sortDd.addEventListener('click',(e)=> e.stopPropagation());

document.querySelectorAll('.dropdown-item').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.dropdown-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    sortDd.classList.remove('show');
  });
});

document.getElementById('priceApply').addEventListener('click',()=>{
  const min = document.getElementById('priceMin').value;
  const max = document.getElementById('priceMax').value;
  console.log('Фильтр по цене:', min, '—', max);
  filterDd.classList.remove('show');
});
</script>
</body>
</html>
