<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Гра - Магазин</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh; 
    overflow: hidden;
    background: #000; /* ЧИСТИЙ ЧЕРНЫЙ ФОН */
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    cursor: pointer;
  }

  #game-container {
    position: relative;
    width: 1185px; 
    height: 835px;
    flex-shrink: 0;
    transform-origin: center center;
  }

  .bg-image {
    width: 100%;
    height: 100%;
    object-fit: fill; 
    display: block;
    pointer-events: none; 
  }

  .overlay-photo {
    position: absolute;
    left: 1.18%;
    top: 49.87%;
    width: 36.52%;
    height: auto;
    pointer-events: none;
    display: block;
  }
</style>
</head>
<body>

  <div id="game-container">
    <img src="https://i.postimg.cc/0y2djZ8d/file-00000000beb882439e314b43f17d013b.png" class="bg-image" alt="Магазин">
    <img src="https://i.postimg.cc/FK9Kf2vN/file-00000000df8081f4a6bfb0b9c582112a.png" class="overlay-photo" alt="Каса">
  </div>

<script>
  const container = document.getElementById('game-container');

  function resizeGame() {
    const windowWidth = window.innerWidth;
    const gameWidth = 1185;

    // МАГИЯ ЗДЕСЬ: Мы берем ширину экрана и делим на ширину картинки.
    // Это заставляет картинку ВСЕГДА заполнять экран от левого до правого края!
    // Высота подстраивается автоматически.
    const scale = windowWidth / gameWidth;
    
    container.style.transform = `scale(${scale})`;
  }

  window.addEventListener('load', resizeGame);
  window.addEventListener('resize', resizeGame);
  window.addEventListener('orientationchange', resizeGame);
  setTimeout(resizeGame, 100);

  // --- УМНАЯ ПРОВЕРКА (Сайт или Приложение) ---
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(err => console.log(err));
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    }
  }

  if (!isStandalone) {
    document.addEventListener('click', toggleFullscreen);
    document.addEventListener('touchstart', (e) => {
      if(e.cancelable) e.preventDefault(); 
      toggleFullscreen();
    }, { passive: false });
  } else {
    document.body.style.cursor = 'default';
  }
</script>

</body>
</html>
